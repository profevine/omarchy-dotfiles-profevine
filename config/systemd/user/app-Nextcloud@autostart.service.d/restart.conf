# O cliente do Nextcloud sobe pelo autostart do XDG, que por padrão não o
# reabre se ele travar. Sem ele rodando, uma máquina fica dias sem
# sincronizar e, quando volta, pode propagar exclusões antigas.
# on-failure, não always: se o cliente já foi aberto pelo menu, a cópia do
# autostart sai com status 0 e o always a reiniciaria em loop.
[Service]
Restart=on-failure
RestartSec=15

[Unit]
StartLimitIntervalSec=0
